version: "3.9"
services:
  # back C#
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solicitacoes-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://+:5000
    restart: unless-stopped
  # front HTML 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solicitacoes-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped